name: Mirror Milvus

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download and publish Milvus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SOURCE="milvusdb/milvus:v2.5.4"
          TARGET="ghcr.io/${OWNER}/rag-milvus:v2.5.4"

          docker pull --platform linux/amd64 "$SOURCE"

          docker image inspect "$SOURCE" \
            --format 'Source={{json .RepoDigests}} Platform={{.Os}}/{{.Architecture}}'

          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"

          echo "镜像地址：${TARGET}" >> "$GITHUB_STEP_SUMMARY"
